name: Build release packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  package:
    strategy:
      matrix:
        include:
          - rid: win-x64
            artifact: PrintCapturePOC-windows-x64
          - rid: osx-x64
            artifact: PrintCapturePOC-macos-intel
          - rid: osx-arm64
            artifact: PrintCapturePOC-macos-apple-silicon
          - rid: linux-x64
            artifact: PrintCapturePOC-linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained app
        run: dotnet publish src/PrintSaveApp/PrintSaveApp.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o publish/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.artifact }}/
